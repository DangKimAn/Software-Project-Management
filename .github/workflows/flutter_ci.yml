name: Flutter CI & Quality Gate

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
    paths:
      - "hotel-booking-flutter/**"
      - "tools/quality/**"
      - ".github/workflows/flutter_ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "hotel-booking-flutter/**"
      - "tools/quality/**"
      - ".github/workflows/flutter_ci.yml"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Secret Audit, Lint, Unit/Widget & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-booking-flutter

    steps:
      # Bước kiểm tra nguồn PR
      - name: Check source branch
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "LỖI: Bạn chỉ được phép gộp code vào main từ nhánh develop!"
            exit 1
          fi

      - name: Checkout Repository (Zero Credential Persistence)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Secret, Zero-Mock & FLUTTER_RULES Audit
        run: dart run tools/quality/secret_and_rule_audit.dart

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed test/integration integration_test tools/quality

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test --exclude-tags=golden

      - name: Run Automated E2E Test Suite
        run: flutter test test/integration/e2e_all_flows_test.dart

      - name: Verify Flutter Web Production Build
        run: flutter build web --release --dart-define-from-file=config/staging.json

      - name: Verify Debug/Staging Android APK Build
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G"
        run: flutter build apk --debug --dart-define-from-file=config/staging.json
