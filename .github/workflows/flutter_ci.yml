name: Flutter CI Quality Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'feat/**' ]
    paths:
      - 'hotel-booking-flutter/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [ main, develop, 'feature/**', 'feat/**' ]
    paths:
      - 'hotel-booking-flutter/**'
      - '.github/workflows/flutter_ci.yml'

jobs:
  quality_checks:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-booking-flutter

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Check Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Code Analysis (Linter)
        run: flutter analyze

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

  build_android:
    name: Build Android Verification
    needs: quality_checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-booking-flutter

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Dev Flavor)
        run: flutter build apk --flavor dev -t lib/main_dev.dart --dart-define-from-file=config/dev.json
