name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger via GitHub Actions"

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy_to_render:
    name: Trigger Render Web Service Deployment & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        id: trigger_deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set. Skipping live webhook call."
            exit 0
          fi
          echo "Sending deployment trigger to Render..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully triggered Render deployment."
          else
            echo "::error::Render deploy hook returned status $HTTP_CODE"
            exit 1
          fi

      - name: Health Check Verification
        env:
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
        run: |
          if [ -z "$BACKEND_PUBLIC_URL" ]; then
            echo "BACKEND_PUBLIC_URL is not configured. Skipping post-deploy health check."
            exit 0
          fi
          echo "Waiting 30 seconds for service restart..."
          sleep 30
          for i in {1..10}; do
            echo "Checking $BACKEND_PUBLIC_URL/api/health (Attempt $i/10)..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_PUBLIC_URL/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend is live and healthy!"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Healthcheck timed out or backend service is still spinning up."
