name: Backend CI with Virtual Database

on:
  push:
    branches: [ "develop", "main", "test", "test/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "develop", "main", "test" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. KHAI BÁO DATABASE ẢO (SERVICE CONTAINERS)
    services:
      # Database chính: MySQL 8.0
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: hotel_booking_test  # Tạo sẵn database tên này
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # (Tùy chọn) Database Vector: Qdrant cho tính năng AI Search
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    defaults:
      run:
        working-directory: backend

    steps:
      # Bước kiểm tra nguồn PR (chỉ cho phép gộp vào main từ develop)
      - name: Check source branch
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "LỖI: Bạn chỉ được phép gộp code vào main từ nhánh develop!"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cài đặt thư viện (Dependencies)
        run: npm ci

      # 2. CHUẨN BỊ DATABASE & CẤU TRÚC BẢNG (SEQUELIZE)
      - name: Chạy Sequelize Migration tạo 49 bảng
        env:
          NODE_ENV: test
          ALLOW_REFRESH_TOKEN_IN_BODY: "false"
          ALLOW_REFRESH_TOKEN_IN_HEADER: "false"
          JWT_SECRET_KEY: test_jwt_secret_key_at_least_32_chars_long
          JWT_ACCESS_SECRET: test_jwt_access_secret_at_least_32_chars
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_at_least_32_chars
          TOKEN_HASH_SECRET: test_token_hash_secret_at_least_32_chars
          OTP_HASH_SECRET: test_otp_hash_secret_at_least_32_chars
          COOKIE_SECRET: test_cookie_secret_at_least_32_chars
          # Cấp biến môi trường để code Node.js kết nối đúng vào MySQL ảo
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: hotel_booking_test
          DB_DIALECT: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_DATABASE: hotel_booking_test
          ALLOW_DATABASE_ROOT_USER: "true"
        run: |
          npm run db:ensure-runtime-schema
          npm run db:migrate || true
          # Nếu bạn có dữ liệu mẫu giả lập (seeders) thì chạy thêm lệnh dưới:
          # npx sequelize-cli db:seed:all 

      # 3. CHẠY KIỂM THỬ
      - name: Chạy Unit & Integration Tests
        env:
          NODE_ENV: test
          ALLOW_REFRESH_TOKEN_IN_BODY: "false"
          ALLOW_REFRESH_TOKEN_IN_HEADER: "false"
          JWT_SECRET_KEY: test_jwt_secret_key_at_least_32_chars_long
          JWT_ACCESS_SECRET: test_jwt_access_secret_at_least_32_chars
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_at_least_32_chars
          TOKEN_HASH_SECRET: test_token_hash_secret_at_least_32_chars
          OTP_HASH_SECRET: test_otp_hash_secret_at_least_32_chars
          COOKIE_SECRET: test_cookie_secret_at_least_32_chars
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: hotel_booking_test
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_DATABASE: hotel_booking_test
          ALLOW_DATABASE_ROOT_USER: "true"
          QDRANT_URL: http://127.0.0.1:6333
        run: npm run test
