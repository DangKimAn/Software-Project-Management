name: Minh Thanh Villa Flutter CI & Quality Gate

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: flutter-ci-subproject-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Secret Audit, Format, Analyze, Unit/Widget & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Zero Credential Persistence)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Secret, Zero-Mock & FLUTTER_RULES Audit
        run: dart run tools/quality/secret_and_rule_audit.dart

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tools/quality

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test --exclude-tags=golden

      - name: Run Automated E2E & Multi-Viewport Visual Checklist Suite
        run: flutter test test/integration/e2e_all_flows_test.dart test/integration/visual_ui_checklist_test.dart

      - name: Verify Debug/Staging Android APK Build
        run: flutter build apk --debug --dart-define=APP_ENV=staging --dart-define=API_BASE_URL=https://staging-api.minhthanhvilla.com
